# 整个工作流的名称，显示在仓库的 Actions 页面
name: Practice CI

# 定义什么时候触发工作流
on:
  # 第一种触发条件：推送提交
  push:
    # 只关注推送到 main 分支的提交
    branches: [main]

  # 第二种触发条件：PR 事件
  pull_request:
    # 只关注准备合入 main 的 PR
    branches: [main]

# 设置工作流使用 GitHub 仓库的权限
permissions:
  # 允许读取仓库内容，本例不需要写入仓库
  contents: read

# 定义工作流中的作业
jobs:
  # 作业的内部标识
  lesson-check:
    # 作业显示的名称，也是我们要选择的检查名称
    name: lesson-check

    # 在 GitHub 提供的 Ubuntu Linux 执行器上运行
    runs-on: ubuntu-latest

    # 定义这个作业依次执行的步骤
    steps:
      # 第一步的显示名称
      - name: Checkout repository
        # 调用 checkout 动作的 v7 版本，取得待检查的仓库代码
        uses: actions/checkout@v7

      # 第二步的显示名称
      - name: Validate practice config
        # 使用 Bash 执行后面的命令
        shell: bash

        # 竖线表示后面是一段保留换行的多行脚本
        run: |
          # 检查当前目录是否存在 config.txt 文件
          test -f config.txt

          # 检查文件中是否包含指定的项目标识
          grep -Fq 'app_name=git-team-practice' config.txt

          # 前面的命令都成功后，输出这句成功提示
          echo "Practice check passed"
